<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Barbershop | Reserva tu cita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app">

    <!-- ===================== HOME ===================== -->
    <section class="view active" id="home">
      <!-- Fondo del hero: ver styles.css (.hero) para pegar el Base64 -->
      <div class="hero"></div>

      <div class="hero-content">
        <h1 class="hero-title">
          EL ESTILO COMIENZA
          <span class="red">CON UN BUEN CORTE</span>
        </h1>
        <button class="btn-red" data-go="paso1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="2"/>
            <path d="M3 9h18M8 2v4M16 2v4"/>
          </svg>
          RESERVA AHORA
        </button>
      </div>
    </section>

    <!-- ===================== PASO 1: BARBEROS ===================== -->
    <section class="view" id="paso1">
      <div class="stripes stripes-tl"></div>
      <div class="stripes stripes-tr"></div>
      <div class="stripes stripes-bl"></div>
      <div class="stripes stripes-br"></div>

      <!-- Decoración: poste, navaja. Base64 en styles.css (DECORACIONES) -->
      <div class="deco deco-pole"></div>
      <div class="deco deco-razor"></div>

      <button class="back" data-back>← Atrás</button>

      <header class="step-header">
        <h2 class="step-title"><span class="red">PASO 1.</span> ESCOGE A TU BARBERO</h2>
      </header>

      <div class="carousel">
        <button class="arrow" id="barberPrev" aria-label="Barbero anterior">‹</button>
        <div class="cards" id="barberCards"></div>
        <button class="arrow" id="barberNext" aria-label="Siguiente barbero">›</button>
      </div>

      <footer class="step-footer">
        <button class="btn-red" data-go="paso2">CONTINUAR</button>
      </footer>
    </section>

    <!-- ===================== PASO 2: SERVICIOS ===================== -->
    <section class="view" id="paso2">
      <div class="stripes stripes-tl"></div>
      <div class="stripes stripes-tr"></div>
      <div class="stripes stripes-bl"></div>
      <div class="stripes stripes-br"></div>

      <div class="deco deco-pole"></div>
      <div class="deco deco-clipper-left"></div>

      <button class="back" data-back>← Atrás</button>

      <header class="step-header">
        <h2 class="step-title"><span class="red">PASO 2.</span> ESCOGE EL SERVICIO QUE DESEES</h2>
      </header>

      <div class="carousel">
        <button class="arrow" id="servicePrev" aria-label="Servicio anterior">‹</button>
        <div class="cards" id="serviceCards">
          <!-- Las tarjetas se generan en app.js con estos marcadores Base64:
               SERVICIO_CORTE, BARBA y SERVICIO_COMPLETO -->
        </div>
        <button class="arrow" id="serviceNext" aria-label="Siguiente servicio">›</button>
      </div>

      <footer class="step-footer">
        <button class="btn-red" data-go="paso3">CONTINUAR</button>
      </footer>
    </section>

    <!-- ===================== PASO 3: FECHA Y HORA ===================== -->
    <section class="view" id="paso3">
      <div class="stripes stripes-tl"></div>
      <div class="stripes stripes-tr"></div>
      <div class="stripes stripes-bl"></div>
      <div class="stripes stripes-br"></div>

      <div class="deco deco-pole"></div>
      <div class="deco deco-clipper-right"></div>

      <button class="back" data-back>← Atrás</button>

      <header class="step-header">
        <h2 class="step-title"><span class="red">PASO 3.</span> ESCOGE FECHA Y HORA</h2>
      </header>

      <div class="schedule">
        <div class="calendar-box">
          <h3 class="month-title">OCTUBRE 2026</h3>
          <div class="weekdays">
            <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div class="days" id="calendarDays"></div>
        </div>

        <div class="slots-box">
          <p class="slots-label">HORARIOS DISPONIBLES</p>
          <p class="slots-date" id="slotsDate"></p>
          <div class="slots" id="slots"></div>
        </div>
      </div>

      <footer class="step-footer">
        <button class="btn-red" id="confirmBtn" disabled>CONFIRMAR RESERVA</button>
      </footer>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
